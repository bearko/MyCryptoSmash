  <head>
    <meta charset="UTF-8" />

    <!-- リンクを共有したときのサムネイルと説明 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bearko.games" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://smash.bearko.games/" />
    <meta property="og:title" content="My Crypto Smash｜呪われたピンボールから脱出せよ" />
    <meta property="og:description" content="呪われたピンボールで GUM を稼ぎ、3 プレイ以内に入金口へノルマを納めろ。品を重ねて★を上げ、マレットを鍛え、仕掛けで台を育ててピエロをジョーカーに戻せ！ スマホを傾けて・振って・はじいて遊ぶ（非公式二次創作・無料）" />
    <meta property="og:image" content="https://smash.bearko.games/og.jpg?v=6" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />

    <meta property="og:image:alt" content="My Crypto Smash：ピエロの顔が光るピンボール台と「打って、強化して、生き延びろ。」のキャッチコピー、ロゴ、スマホ対応・ブラウザゲーム・完全無料、smash.bearko.games" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Crypto Smash｜呪われたピンボールから脱出せよ" />
    <meta name="twitter:description" content="呪われたピンボールで GUM を稼ぎ、ノルマを納めて脱出せよ。品を重ねて★を上げ、ピエロをジョーカーに（非公式二次創作・無料）" />
    <meta name="twitter:image" content="https://smash.bearko.games/og.jpg?v=6" />
    <meta name="twitter:image:alt" content="My Crypto Smash：ピエロの顔が光るピンボール台と「打って、強化して、生き延びろ。」のキャッチコピー、ロゴ、スマホ対応・ブラウザゲーム・完全無料、smash.bearko.games" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="app">
      <canvas id="cv"></canvas>
      <div id="callouts" class="callouts" aria-live="polite"></div>

      <header class="top">
        <div class="gum"><img id="gumIcon" alt="" /><div><b id="gumText">0</b><small><span class="hud-emb" aria-label="エンブレム"><i class="emb"></i><b id="embText">0</b></span><span id="gumRate"></span></small></div></div>
        <div class="stage">
          <div class="stage-row"><span id="stageText">FLOOR 1 / 50</span><b id="timer" class="timer">15.0</b></div>
          <div class="bar"><i id="stageBar"></i></div>
        </div>
        <button id="btnHelp" class="icon help" aria-label="遊び方" aria-expanded="false">?</button>
        <button id="btnSettings" class="icon" aria-label="設定">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </header>
      <div id="buffs" class="buffs"></div>

      <footer class="bottom">
        <button id="btnLevel" class="level" aria-label="水平リセット">
          <span class="bubble"><i id="bubbleDot"></i></span>
          <span class="lv-label">水平<br />リセット</span>
        </button>
        <div id="mode" class="mode">傾き</div>
        <button id="btnHero" class="pill">ヒーロー</button>
        <button id="btnShop" class="pill main">強化<span id="shopBadge" class="badge" hidden></span></button>
      </footer>

      <section id="sheet" class="sheet" hidden>
        <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" class="icon" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
        </button></div>
        <div id="sheetBody" class="sheet-body"></div>
      </section>

      <div id="banner" class="banner" hidden></div>
      <div id="toast" class="toast" hidden></div>

      <div id="home" class="home">
        <div id="homeTrack" class="home-track">
          <section id="pageShop" class="page page-shop" aria-label="ショップ"></section>
          <!-- ピンボール：本物の台がそのまま見える（打ち出すとプレイが始まる）。ボタンは置かない -->
          <section id="pagePin" class="page page-pin" aria-label="ピンボール"></section>
          <section id="pageLab" class="page page-lab" aria-label="ラボ"></section>
        </div>
        <nav class="home-nav" aria-label="画面の切りかえ">
          <button data-tab="0"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 4h16l-1.5 6.5a2 2 0 0 1-2 1.5H8.2l.5 2H18v2H7.2L4.6 6H2V4zm4 15a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg><span>ショップ</span></button>
          <button data-tab="1"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM7 16.5l3-2.5h4l3 2.5-1 1.5H8z"/></svg><span>ピンボール</span></button>
          <button data-tab="2"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9 2h6v2h-1v5.3l5.6 9.4A2 2 0 0 1 17.9 22H6.1a2 2 0 0 1-1.7-3.3L10 9.3V4H9zm3 9.6L8.2 18h7.6z"/></svg><span>ラボ</span></button>
        </nav>
      </div>

      <div id="result" class="result" hidden>
        <div class="result-card">
          <h2 id="resTitle" class="res-title">TIME UP!</h2>
          <div id="resBody" class="res-body"></div>
          <div class="res-btns">
            <button id="btnResShop" class="res-tree">ショップ</button>
            <button id="btnResLab" class="res-tree res-lab">ラボ</button>
            <button id="btnResAgain" class="start">台へもどる</button>
          </div>
        </div>
      </div>

      <div class="rotate"><div>スマホを縦向きにして遊んでください</div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
